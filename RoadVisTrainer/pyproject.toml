[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roadvis-trainer"
version = "0.1.0"
description = "RoadVis Trainer: continuous-learning server for the RoadVis apps (ingest, auto-label, quality gate, Colab training, model publishing)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10",
    # numpy 2.4+ breaks coremltools 9.0 export (apple/coremltools#2633); Ultralytics enforces the same bound.
    "numpy>=1.23,<=2.3.5",
    "pyyaml>=6",
    # Teacher, evaluation and export (AGPL-3.0). Install CPU torch first from the PyTorch CPU index, see README.
    "ultralytics>=8.4,<9",
    "torch>=2.4,<2.8",
    "torchvision>=0.19,<0.23",
    "coremltools>=9.0,<10",
    "onnx>=1.15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
roadvis-trainer = "roadvis_trainer.cli:main"

[tool.setuptools.packages.find]
include = ["roadvis_trainer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with"]
