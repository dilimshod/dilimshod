name: RoadVis Android

on:
  pull_request:
    paths:
      - "RoadVisAndroid/**"
      - ".github/workflows/roadvis-android.yml"
  workflow_dispatch:

permissions:
  contents: write   # publish the APK to the public "android-latest" pre-release (direct download link)

concurrency:
  group: roadvis-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RoadVisAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP downloads the missing platform/build-tools.
      - uses: gradle/actions/setup-gradle@v4
      - name: Core unit tests
        run: ./gradlew :core:test --console=plain
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoadVis-android-apk
          path: RoadVisAndroid/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/RoadVis.apk
      - name: Publish to the android-latest pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: RoadVis Android (latest build)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          body: |
            Latest Android build of RoadVis (commit ${{ github.event.pull_request.head.sha || github.sha }}).
            Download RoadVis.apk below, open it on an Android phone and allow "Install unknown apps".
          files: RoadVisAndroid/app/build/outputs/apk/release/RoadVis.apk
