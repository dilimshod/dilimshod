# CI for the RoadVision iOS app (folder RoadVision/ of this repository).
#  - core-tests: platform-independent RoadVisionCore logic, `swift test` on Linux (official Swift image).
#  - ios-build:  builds the app for the iOS Simulator (no signing) with
#                * the newest Xcode 26.x on the macOS 26 (arm64) runner, and
#                * Xcode 16.4 on the macOS 15 (arm64) runner (the app must keep compiling with the iOS 18 SDK).
# Runner labels / Xcode versions: https://github.com/actions/runner-images (macos-26: Xcode 26.0.1 … 26.6,
# macos-15: Xcode 16.0 … 16.4 + 26.0.1 … 26.3).
name: RoadVision iOS

on:
  push:
    paths:
      - "RoadVision/**"
      - ".github/workflows/roadvision-ios.yml"
  pull_request:
    paths:
      - "RoadVision/**"
      - ".github/workflows/roadvision-ios.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    name: RoadVisionCore tests (Linux, Swift 6.2)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: swift:6.2.4-noble
    defaults:
      run:
        working-directory: RoadVision/Packages/RoadVisionCore
    steps:
      - uses: actions/checkout@v6
      - name: Swift version
        run: swift --version
      - name: Build and test
        run: swift test

  ios-build:
    name: iOS build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Xcode 26 (latest)
            runner: macos-26
            xcode: "26"
            log: build-xcode26
          - name: Xcode 16.4
            runner: macos-15
            xcode: "16.4"
            log: build-xcode16.4
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          # Real directories only (the runner image also has Xcode_X.Y.0.app symlinks); newest version wins.
          XCODE_APP=$(find /Applications -maxdepth 1 -type d -name "Xcode_${{ matrix.xcode }}*.app" | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode ${{ matrix.xcode }} found on ${{ matrix.runner }}"
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"

      - name: Lint project file
        run: plutil -lint RoadVision/RoadVision.xcodeproj/project.pbxproj

      - name: Xcode version
        run: |
          xcodebuild -version
          xcodebuild -project RoadVision/RoadVision.xcodeproj -list

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project RoadVision/RoadVision.xcodeproj \
            -scheme RoadVision \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.log }}-log
          path: build.log
          if-no-files-found: ignore
