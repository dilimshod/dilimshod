name: RoadVis Trainer

on:
  pull_request:
    paths:
      - "RoadVisTrainer/**"
      - ".github/workflows/roadvis-trainer.yml"
  workflow_dispatch:

concurrency:
  group: roadvis-trainer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RoadVisTrainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: RoadVisTrainer/pyproject.toml
      # CPU-only torch first, so the ultralytics dependency does not pull the CUDA build.
      - name: Install CPU torch
        run: pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e ".[dev]"
      # Unit tests mock the teacher and the exporters: no network and no model downloads.
      - name: Tests
        run: pytest -q
