# XcodeGen fallback for RoadVision (https://github.com/yonaskolb/XcodeGen).
#
# The repository already contains a hand-written RoadVision.xcodeproj. Use this file only if that project
# does not open or build in your Xcode version:
#
#   brew install xcodegen          # XcodeGen 2.43+ (synced folders need projectFormat xcode16_0)
#   cd RoadVision && xcodegen generate
#
# It regenerates RoadVision.xcodeproj with the same single app target, the same two synchronized
# ("buildable") folders and the same build settings. XcodeGen also rewrites Config/Info.plist from
# `info.properties` below (adding the standard CFBundle* keys), which is expected.

name: RoadVision

options:
  projectFormat: xcode16_0
  xcodeVersion: "26.0"
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    MTL_FAST_MATH: YES
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_OPTIMIZATION_LEVEL: "0"
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

targets:
  RoadVision:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # App folder: Swift sources, Assets.xcassets and Models/*.mlpackage (compiled to .mlmodelc by Xcode).
      - path: RoadVision
        type: syncedFolder
        excludes:
          - "Models/README.md"
      # Platform-independent core logic, compiled directly into the app target (no `import RoadVisionCore`).
      - path: Packages/RoadVisionCore/Sources/RoadVisionCore
        name: RoadVisionCore
        type: syncedFolder
      - path: Config/Info.plist
        buildPhase: none
      - path: README.md
        buildPhase: none
    info:
      path: Config/Info.plist
      properties:
        UIBackgroundModes: [location, audio]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.roadvision.RoadVision
        PRODUCT_NAME: "$(TARGET_NAME)"
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RoadVision
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.navigation
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера нужна для распознавания транспортных средств, светофоров и пешеходов на дороге."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Геопозиция нужна для скорости движения, навигации, данных о полосах и ограничениях скорости."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Во время навигации геопозиция используется и в фоне, чтобы подсказки продолжали работать."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Микрофон нужен для голосового общения с ИИ‑помощником."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Распознавание речи превращает ваши голосовые вопросы в текст для ИИ‑помощника."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Доступ к локальной сети нужен, чтобы подключиться к ИИ‑модели (Ollama / LM Studio) на вашем Mac."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Models are loaded by bundle resource name; no generated Swift classes (avoids type-name clashes).
        COREML_CODEGEN_LANGUAGE: None
        DEVELOPMENT_TEAM: ""
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  RoadVision:
    build:
      targets:
        RoadVision: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
